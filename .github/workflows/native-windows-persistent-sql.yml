name: Windows private persistent SQL (RED spike)
on:
  push:
    branches: [test/rebuild-20261110]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-persistent-sql-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  broker:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record source and experiment boundary
        run: |
          git rev-parse HEAD
          go version
          go env GOOS GOARCH
          echo 'Private refusing VFS, actual stock WAL child, positive SQL contract intentionally RED. No production qualification.'
      - name: Record Windows token and NTFS runtime
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          "ElevatedAdministratorToken: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          Get-Volume -DriveLetter ([System.IO.Path]::GetPathRoot($env:RUNNER_TEMP).Substring(0,1)) | Select-Object DriveLetter, FileSystemType, DriveType, HealthStatus
      - name: Runner contract tests
        run: node --test scripts/sqlite-persistent-vfs-runner.test.mjs
      - name: Real private SQL positive contract (intentionally RED)
        run: |
          set -o pipefail
          node scripts/sqlite-persistent-vfs-runner.mjs | tee persistent-sql-native.json
      - name: Preserve raw evidence even on expected RED
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persistent-sql-native
          path: persistent-sql-native.json
          if-no-files-found: error
      - name: Verify unchanged modules
        if: ${{ !cancelled() }}
        run: |
          go mod verify
          git diff --exit-code -- go.mod go.sum
