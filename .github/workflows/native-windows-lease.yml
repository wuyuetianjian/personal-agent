name: Windows owner/connection/resource lease (experimental)
on:
  push:
    branches: [test/rebuild-20261110]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-lease-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  lease:
    if: ${{ github.ref == 'refs/heads/test/rebuild-20261110' }}
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record source and experiment boundary
        run: |
          git rev-parse HEAD
          go version
          go env GOOS GOARCH
          echo 'Disconnected lease lifecycle only. Not stock WAL/SHM interoperability or production qualification.'
      - name: Record Windows token and NTFS runtime
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          "ElevatedAdministratorToken: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          Get-Volume -DriveLetter ([System.IO.Path]::GetPathRoot($env:RUNNER_TEMP).Substring(0,1)) | Select-Object DriveLetter, FileSystemType, DriveType, HealthStatus
      - name: Test exact event gate
        run: node --test scripts/windows-lease-gate.test.mjs
      - name: Verify ordinary production sources and record research graphs
        run: |
          go mod verify
          go list -mod=readonly -deps ./cmd/... > lease-production-deps.txt
          go list -mod=readonly -tags=nativeprobe_sqlite_identity,nativeprobe_sqlite_lease -deps ./cmd/... > lease-tagged-deps.txt
          # Tagged graphs above are research observations, not release qualification.
          node --test scripts/production-native-deps.test.mjs
          node scripts/production-native-deps.mjs
      - name: Native owner/connection/resource lease contracts
        id: native
        run: |
          set -o pipefail
          go test -json -mod=readonly -tags=nativeprobe_sqlite_identity,nativeprobe_sqlite_lease -count=3 -timeout=5m -run '^TestPersistentLease' ./internal/nativefs/windowsprobe | tee lease-native.json
      - name: Require every contract without skips
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        run: node scripts/windows-lease-gate.mjs lease-native.json
      - name: Verify unchanged modules
        if: ${{ !cancelled() }}
        run: go mod verify
      - name: Preserve ordinary dependency audit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows-lease-production-deps
          path: |
            production-native-deps.json
            production-native-env.json
          if-no-files-found: warn
