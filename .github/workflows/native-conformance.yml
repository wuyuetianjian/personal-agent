name: Native conformance (capabilities disabled)

on:
  push:
    branches: [test/rebuild-20261110]
  workflow_dispatch:

# No secrets, write token, deployments, releases, or privileged host changes.
permissions:
  contents: read

concurrency:
  group: native-conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.os }} native refusal and regression
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        id: node
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record exact source and native runtime
        run: |
          git rev-parse HEAD
          go version
          go env GOOS GOARCH
          node --version
          printf 'These tests cover disabled-capability refusals and disconnected foundation experiments.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Read, Search, Replace, Undo, Exec, and MCP stdio remain disabled on these targets.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Source: %s\nRunner: %s %s\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Record macOS version and test volume
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
          id -u
          id -G
          df -h "$RUNNER_TEMP"
          diskutil info "$(df "$RUNNER_TEMP" | awk 'NR==2 {print $1}')"
      - name: Record Windows version and test volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          "ElevatedAdministratorToken: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          Get-Volume -DriveLetter ([System.IO.Path]::GetPathRoot($env:RUNNER_TEMP).Substring(0,1)) | Select-Object DriveLetter, FileSystemType, DriveType, HealthStatus
      - name: Run native refusal contracts on the target kernel
        id: native
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: |
          go test -json -count=1 -timeout=10m -run '^(TestNative(Support|MCPReadiness|WorkspaceCapabilities|ToolDefinitions|StatusWire)|TestUnsupportedNativeRefusalContract|TestUnavailable(Native|Platform))' ./internal/interaction ./internal/api | tee native-tests.json
      - name: Require all native contract tests without skips
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' && steps.node.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const events = fs.readFileSync('native-tests.json', 'utf8').trim().split('\n').map(JSON.parse);
          const required = {
            'agent/internal/interaction': ['TestNativeSupportDependenciesAndBundle', 'TestNativeSupportDisabledTargets', 'TestNativeMCPReadinessIndependent', 'TestNativeWorkspaceCapabilitiesWireUnchanged', 'TestNativeToolDefinitionsForSupport', 'TestUnsupportedNativeRefusalContract', 'TestUnavailableNativeProposalAndDispatch', 'TestUnavailableNativeStoredOperations', 'TestUnavailableNativeMCPPreparation', 'TestUnavailablePlatformFailsClosed', 'TestUnavailablePlatformDirectRefusals'],
            'agent/internal/api': ['TestNativeStatusWireUnchanged', 'TestUnavailableNativeServiceBoundaries'],
          };
          assert(!events.some(e => ['skip', 'fail'].includes(e.Action)), 'Native contract skipped or failed');
          for (const [pkg, tests] of Object.entries(required)) {
            assert(events.some(e => e.Package === pkg && !e.Test && e.Action === 'pass'), `${pkg} did not finish`);
            for (const test of tests) assert(events.some(e => e.Package === pkg && e.Test === test && e.Action === 'pass'), `${pkg}/${test} did not pass`);
          }
          const passed = events.filter(e => e.Test && e.Action === 'pass').length;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Native refusal contracts: ${passed} tests/subtests passed, zero skipped. This does not qualify enabled native adapters.\n`);
          JS
      - name: Verify foundations remain disconnected from commands
        if: ${{ !cancelled() && steps.go.outcome == 'success' && steps.node.outcome == 'success' }}
        run: |
          go list -deps ./cmd/... > command-dependencies.txt
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const deps = fs.readFileSync('command-dependencies.txt', 'utf8').split('\n');
          assert(!deps.some(p => p.startsWith('agent/internal/nativefs/')), 'Experimental foundation is reachable from a production command');
          JS
      - name: Run disconnected foundations on the target kernel
        id: foundation
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: go test -json -count=1 -timeout=5m ./internal/nativefs/... | tee foundation-tests.json
      - name: Require complete foundation tests without skips
        if: ${{ !cancelled() && steps.foundation.outcome != 'skipped' && steps.node.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const events = fs.readFileSync('foundation-tests.json', 'utf8').trim().split('\n').map(JSON.parse);
          const native = process.platform === 'darwin' ? 'darwinprobe' : 'windowsprobe';
          const required = {
            darwinprobe: ['TestComponents', 'TestOwnedDuplicationAndClose', 'TestCloseReportsDescriptorError', 'TestPinnedRename', 'TestLeafRefusalsAndNoFIFOReader', 'TestDirectoryRefusalsAndCleanup', 'TestBoundedLineageClosesAllDescriptors', 'TestRejectNonAPFSRoot', 'TestZeroValueObservationReturnsClosed', 'TestZeroValueClose'],
            windowsprobe: ['TestComponents', 'TestNativeABI', 'TestNativeBoundedReadAndOwnership', 'TestNativeExactNamesAndHardlinks', 'TestNativeWriterAndCancelled', 'TestNativeSymlink', 'TestNativePinnedIdentityAndConventionalReplacement', 'TestNativeErrorsAndHandleRelease', 'TestNativeJunction', 'TestNativeNestedGuardAndHandleCount'],
          };
          assert(!events.some(e => ['skip', 'fail'].includes(e.Action)), 'Foundation test skipped or failed');
          for (const name of ['darwinprobe', 'windowsprobe']) {
            const pkg = `agent/internal/nativefs/${name}`;
            assert(events.some(e => e.Package === pkg && !e.Test && e.Action === 'pass'), `${pkg} did not finish`);
            const tests = name === native ? required[name] : ['TestComponents'];
            for (const test of tests) assert(events.some(e => e.Package === pkg && e.Test === test && e.Action === 'pass'), `${pkg}/${test} did not pass`);
          }
          const passed = events.filter(e => e.Test && e.Action === 'pass').length;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Disconnected foundation experiments: ${passed} tests/subtests passed, zero skipped. This is not production adapter qualification; see docs/release/native-foundation.md.\n`);
          JS
      - name: Run complete Go regression suite
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: go test -json -count=1 -timeout=15m ./... | tee go-tests.json
      - name: Report all Go failures and skips
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if (!fs.existsSync('go-tests.json')) throw new Error('Complete Go suite did not run');
          const events = fs.readFileSync('go-tests.json', 'utf8').trim().split('\n').map(JSON.parse);
          for (const action of ['pass', 'skip', 'fail']) {
            const rows = events.filter(e => e.Test && e.Action === action);
            const line = `Go tests/subtests ${action}: ${rows.length}\n`;
            console.log(line.trim());
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line);
            if (action !== 'pass') for (const e of rows) console.log(`${action}: ${e.Package}/${e.Test}`);
          }
          JS
      - name: Vet Go packages
        if: ${{ !cancelled() && steps.go.outcome == 'success' }}
        run: go vet ./...
      - name: Install locked JavaScript dependencies without lifecycle scripts
        id: dependencies
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Run TypeScript tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test packages/protocol/test/*.test.ts packages/client/test/*.test.ts apps/terminal/test/*.test.ts
      - name: Run Markdown safety tests independently
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --import ./apps/terminal/node_modules/tsx/dist/loader.mjs --test apps/web/test/markdown.test.tsx
      - name: Check TypeScript types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm typecheck
