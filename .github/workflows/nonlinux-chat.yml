name: Existing chat-only and stored data on macOS and Windows
on:
  push:
    branches: [test/rebuild-20261110]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nonlinux-chat-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  chat-stored:
    if: ${{ github.ref == 'refs/heads/test/rebuild-20261110' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record source and experiment boundary
        run: |
          git rev-parse HEAD
          go version
          go env GOOS GOARCH CGO_ENABLED
          uname -a
          if [[ "$RUNNER_OS" == "macOS" ]]; then sw_vers; fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then powershell.exe -NoProfile -Command '[Environment]::OSVersion.VersionString'; fi
          echo 'Existing explicitly selected chat_only and stored-data behavior only. Native requests stay rejected; no fallback mode switch. Existing full-suite failures remain separate.'
      - name: Test exact event gate
        run: node --test scripts/nonlinux-chat-gate.test.mjs
      - name: Verify modules and build default commands
        run: |
          go mod verify
          go build -mod=readonly ./cmd/...
      - name: Current chat-only and refusal contracts
        id: native
        run: |
          set -o pipefail
          go test -json -mod=readonly -count=3 -timeout=5m -run '^(TestUnavailableNativeChatStreamAndHistory|TestUnavailableNativeStoredSkillOwnership|TestUnavailableNativeRequestsFailBeforeEffects)$' ./internal/api | tee nonlinux-chat.json
      - name: Require every contract without skips
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        run: node scripts/nonlinux-chat-gate.mjs nonlinux-chat.json
      - name: Verify unchanged modules
        if: ${{ !cancelled() }}
        run: go mod verify
      - name: Preserve raw evidence on every outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nonlinux-chat-${{ matrix.os }}
          path: nonlinux-chat.json
          if-no-files-found: error
