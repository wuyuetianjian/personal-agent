# Browser Automation planning configuration.
# This file describes policy shape only. Do not place secrets, cookies, tokens,
# passwords, or real profile paths here.

browser:
  enabled: true

  runtime:
    provider: "playwright_or_cdp"
    headless_default: false
    default_timeout_ms: 30000

  control:
    preferred_mode: "semantic"
    allow_coordinate_fallback: true
    coordinate_fallback_requires_reason: true

  sessions:
    default_reuse_policy: "reuse_when_allowed"
    storage: "local_only"
    profile_root: "${BROWSER_PROFILE_ROOT}"
    default_expiry: "24h"
    isolation: "per_domain"

  domains:
    mode: "allowlist"
    allowlist:
      - "example.internal"
      - "docs.example.com"

  permissions:
    read:
      auto_allow: true
    navigation:
      auto_allow: true
      require_allowlisted_domain: true
    low_risk_interaction:
      auto_allow: false
    write_interaction:
      require_confirmation: true
    high_risk_transaction:
      require_explicit_confirmation: true

    high_risk_actions:
      - "login_submit"
      - "payment"
      - "delete"
      - "send_message"
      - "post_content"
      - "change_settings"
      - "upload_file"
      - "oauth_grant"
      - "accept_legal_terms"

  privacy:
    public_llm_browser_planning: "redacted_summary_only"
    block_raw_cookies: true
    block_raw_tokens: true
    block_raw_passwords: true
    block_sensitive_raw_dom: true

    identifiers:
      username: "hmac"
      email: "mask"
      hostname: "hmac"
      ip_address: "mask"

  evidence:
    enabled: true
    redact_sensitive_values: true
    capture_screenshot_references: true
    store_raw_cookie_values: false
    store_raw_token_values: false

  cancellation:
    enable_context_cancellation: true
    cancel_on_early_stop: true
    cancel_on_permission_denied: true
    cancel_on_session_expired: true

