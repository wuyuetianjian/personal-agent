config_version: 1
app:
  name: personal-agent
  environment: workstation
  data_dir: ${PACHAT_DATA_DIR}
server:
  enabled: true
  listen_addr: 127.0.0.1:8787
  request_timeout: 120s
storage:
  driver: sqlite
  sqlite:
    path: ${PACHAT_SQLITE_PATH}
privacy:
  hmac_secret_env: PERSONAL_AGENT_PRIVACY_HMAC_SECRET
  fail_closed_for_public_models: true
models:
  default_provider: local-ollama
  providers:
    local-ollama:
      type: openai_compatible
      base_url_env: PACHAT_LOCAL_MODEL_BASE_URL
      api_key_env: PACHAT_LOCAL_MODEL_API_KEY
      trust_level: local_private
  registry:
    - id: local-planner
      provider: local-ollama
      model: ${PACHAT_LOCAL_MODEL}
      trust_level: local_private
      context_window: 32768
      capabilities: [chat, tool_calling, json_schema]
agent:
  leader:
    model_id: local-planner
    temperature: 0.2
    max_output_tokens: 4096
    trust_level_required: local_private
  planner:
    enabled: true
    max_nodes: 8
browser:
  enabled: true
  runtime: chromedp
  screenshot_dir: ${PACHAT_DATA_DIR}/browser/screenshots
permissions:
  default: deny
coding_agents:
  default_backend: ""
  backends: {}
security:
  api:
    auth_token_env: PACHAT_API_TOKEN
    allowed_origins: [http://127.0.0.1:8787]
    max_body_bytes: 1048576
    rate_limit_per_minute: 120
