config_version: 1
app:
  name: personal-agent
  environment: workstation
  data_dir: ${PACHAT_DATA_DIR}
storage:
  driver: sqlite
  sqlite:
    path: ${PACHAT_SQLITE_PATH}
privacy:
  hmac_secret_env: PERSONAL_AGENT_PRIVACY_HMAC_SECRET
  fail_closed_for_public_models: true
models:
  default_provider: local-ollama
  providers:
    local-ollama:
      type: openai_compatible
      base_url_env: PACHAT_LOCAL_MODEL_BASE_URL
      api_key_env: PACHAT_LOCAL_MODEL_API_KEY
      trust_level: local_private
    public-openai-compatible:
      enabled: true
      type: openai_compatible
      base_url_env: PUBLIC_OPENAI_COMPATIBLE_BASE_URL
      api_key_env: PUBLIC_OPENAI_COMPATIBLE_API_KEY
      trust_level: public_remote
      require_privacy_gateway: true
  registry:
    - id: local-planner
      provider: local-ollama
      model: ${PACHAT_LOCAL_MODEL}
      trust_level: local_private
      context_window: 32768
      capabilities: [chat, tool_calling, json_schema]
    - id: public-fallback
      provider: public-openai-compatible
      model: ${PACHAT_PUBLIC_MODEL}
      trust_level: public_remote
      context_window: 128000
      capabilities: [chat, tool_calling, json_schema]
agent:
  leader:
    model_id: local-planner
    trust_level_required: local_private
  planner:
    enabled: true
    max_nodes: 8
rag:
  vector:
    enabled: false
  reranker:
    enabled: false
mcp:
  servers: {}
tools:
  allowlist: []
permissions:
  default: deny
coding_agents:
  default_backend: ""
  cross_review:
    enabled: false
    large_diff_bytes: 20000
  backends: {}
proactive:
  enabled: true
  poll_interval: 30s
